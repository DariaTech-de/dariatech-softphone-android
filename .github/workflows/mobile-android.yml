name: Android

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  build:
    name: Android-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 aktivieren (vorinstalliert)
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Gradle 8.7 installieren
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk "DariaTech-Softphone-Android-debug.apk"

      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "DariaTech Softphone Android – Mobile-Build ${{ github.run_number }}" \
            --notes "Automatischer Android-Debug-Build von Commit ${{ github.sha }}. Zum Installieren auf dem Gerät \"Unbekannte Quellen\" erlauben." \
            --prerelease || true
          gh release upload "$TAG" "DariaTech-Softphone-Android-debug.apk" --clobber
